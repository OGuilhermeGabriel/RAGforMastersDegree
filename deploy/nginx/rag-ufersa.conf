# Configuração Nginx na EC2 (antes de rodar o Certbot para HTTPS)
# Copie para: /etc/nginx/sites-available/rag-ufersa
# Ative com:  sudo ln -s /etc/nginx/sites-available/rag-ufersa /etc/nginx/sites-enabled/
# Teste com:  sudo nginx -t && sudo systemctl reload nginx
# HTTPS com:  sudo certbot --nginx -d guilhermegabriel.grupo-05.sd.ufersa.dev.br -d api.guilhermegabriel.grupo-05.sd.ufersa.dev.br

server {
    listen 80;
    server_name guilhermegabriel.grupo-05.sd.ufersa.dev.br;

    root /var/www/rag-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.guilhermegabriel.grupo-05.sd.ufersa.dev.br;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
